<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#F1F0F2"><title>PACE · 학습 일정</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link rel="stylesheet" href="/src/styles.css"></head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="PACE 홈"><span class="brand-mark" aria-hidden="true">✦</span><span>PACE</span></a>
      <div class="today-heading"><time id="today-date"></time><button class="today-pill" id="go-today-side">오늘</button></div>
      <section class="today-card" aria-labelledby="today-title">
        <div class="card-heading"><span class="section-icon">▦</span><h2 id="today-title">오늘의 학습</h2><button class="card-arrow" id="today-detail" aria-label="오늘 학습 상세 보기">›</button></div>
        <div class="stage-pill"><span>▥</span><span id="today-stage"></span></div>
        <div class="availability"><span class="section-icon">◷</span><div><span>오늘 학습 가능시간</span><strong id="today-capacity"></strong></div><button class="change-capacity" id="change-time" disabled title="2차 개발 예정">2차 예정</button></div>
        <h3 class="assigned-title">오늘 배정된 학습 항목</h3>
        <div id="today-items"></div>
        <div class="today-total"><span>오늘 총 예정시간</span><strong id="today-total"></strong></div>
      </section>
      <nav aria-label="주 메뉴">
        <button class="nav-item active" id="schedule-nav" aria-current="page"><span>▦</span>일정</button>
        <button class="nav-item" data-future="학습 항목"><span>⚑</span>학습 항목</button>
        <button class="nav-item" data-future="학습 가능시간"><span>◷</span>학습 가능시간</button>
        <button class="nav-item" data-future="시험 설정"><span>⚐</span>시험 설정</button>
        <button class="nav-item settings-item" data-future="설정"><span>⚙</span>설정</button>
      </nav>
    </aside>
    <main>
      <section class="calendar-card" id="month-view" aria-label="월간 학습 일정">
        <div class="calendar-topbar">
          <div class="exam-select-wrap" id="exam-select-wrap">
            <button class="exam-select-trigger" id="exam-select-trigger" type="button" aria-label="일정 필터" aria-haspopup="listbox" aria-expanded="false" aria-controls="exam-options"><span id="exam-name" class="exam-name"></span><span id="exam-dday" class="exam-dday"></span><span class="exam-chevron" aria-hidden="true"></span></button>
            <div class="exam-options" id="exam-options" role="listbox" aria-label="일정 필터" hidden></div>
          </div>
          <div class="month-navigation"><button class="month-arrow" id="previous-month" aria-label="이전 달">‹</button><div class="month-title-group"><h2 id="month-title" aria-live="polite"></h2><button class="year-view-toggle" id="year-view-toggle" type="button" aria-label="연간 달력 보기" title="연간 달력 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9h17M7.5 12.5h2M12 12.5h2M16.5 12.5h0M7.5 16h2M12 16h2"/></svg></button></div><button class="month-arrow" id="next-month" aria-label="다음 달">›</button></div>
          <div class="legend"><span><i class="lecture"></i>학습 예정</span><span><i class="goal"></i>목표 일정</span><span><i class="exam"></i>시험 일정</span><span><i class="personal"></i>개인 일정</span></div>
        </div>
        <div class="calendar-body">
          <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="calendar" class="calendar-grid" aria-label="날짜별 일정"></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="date-dialog" aria-labelledby="detail-title"><div class="dialog-top"><h2 id="detail-title"></h2><button class="icon-button" id="close-dialog" aria-label="상세 정보 닫기">×</button></div><div id="detail-content"></div><p class="dialog-note" id="detail-notice" role="status">예시 일정입니다. 등록 및 변경 기능은 2차에서 제공됩니다.</p></dialog>
  <dialog id="year-dialog" class="year-dialog" aria-label="연간 학습 일정">
    <section class="year-card" id="year-view">
      <header class="year-topbar"><button id="previous-year" class="year-arrow" aria-label="이전 연도">‹</button><h1 id="year-title" aria-live="polite"></h1><button id="next-year" class="year-arrow" aria-label="다음 연도">›</button><button id="year-today" class="outline-button" type="button">오늘</button><button id="close-year" class="icon-button year-close" type="button" aria-label="연간 달력 닫기">×</button></header>
      <div id="year-grid" class="year-grid"></div>
    </section>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/app.js"></script>
</body></html>
